<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security analysis report</title>
<style>
/* ============================================================================
   Security analysis report - self-contained stylesheet.
   No external fonts, no CDN, no network. Opens from disk in any browser.
   Palette: dataviz reference instance (categorical slots 1-2 + status roles),
   used verbatim - the documented, validated default.
   ========================================================================= */

:root {
  color-scheme: light;

  --surface-0:      #f4f4f1;   /* page ground   */
  --surface-1:      #fcfcfb;   /* card / chart  */
  --surface-2:      #eeeeea;   /* inset, code   */
  --border:         #dcdcd6;
  --border-strong:  #c3c2b7;

  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #78776f;

  /* categorical - fixed order, never cycled */
  --series-1:       #2a78d6;   /* Current   */
  --series-2:       #eb6834;   /* Projected */

  /* status - reserved roles, always paired with an icon + label */
  --st-good:        #0ca30c;
  --st-warning:     #fab219;
  --st-serious:     #ec835a;
  --st-critical:    #d03b3b;
  --st-neutral:     #78776f;

  --grid:           #e6e6e1;
  --shadow:         0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  --radius:         10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0:      #121211;
    --surface-1:      #1a1a19;
    --surface-2:      #232322;
    --border:         #33332f;
    --border-strong:  #4a4a45;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #96958c;
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --grid:           #2b2b28;
    --shadow:         0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0:      #121211;
  --surface-1:      #1a1a19;
  --surface-2:      #232322;
  --border:         #33332f;
  --border-strong:  #4a4a45;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #96958c;
  --series-1:       #3987e5;
  --series-2:       #d95926;
  --grid:           #2b2b28;
  --shadow:         0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--surface-0);
  color: var(--text-primary);
  font: 15px/1.6 var(--sans);
  padding: 0 0 5rem;
}
img { max-width: 100%; }
[hidden] { display: none !important; }

.wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

/* ---------------------------------------------------------------- header */
header.masthead {
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  padding: 28px 0 22px;
  margin-bottom: 28px;
}
.masthead h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.25; letter-spacing: -.02em; }
.masthead .sub { color: var(--text-secondary); font-size: 14px; margin: 0; }
.meta-grid {
  display: grid; gap: 10px 28px; margin-top: 18px;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  font-size: 13px;
}
.meta-grid dt { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.meta-grid dd { margin: 0; color: var(--text-primary); word-break: break-word; }

.theme-toggle {
  position: absolute; top: 20px; right: 24px;
  background: var(--surface-2); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 14px; font: inherit; font-size: 12px; cursor: pointer;
}
.theme-toggle:hover { border-color: var(--border-strong); color: var(--text-primary); }
.masthead { position: relative; }

/* ---------------------------------------------------------------- sections */
section { margin: 0 0 38px; }
h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-muted); margin: 0 0 14px; font-weight: 600;
}
h3 { font-size: 17px; margin: 0 0 10px; letter-spacing: -.01em; }
p  { margin: 0 0 12px; }

.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
}

/* ---------------------------------------------------------------- score tiles */
.score-row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.tile {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
}
.tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 6px; }
.tile .hero { font-size: 40px; line-height: 1; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tile .hero .of { font-size: 17px; font-weight: 400; color: var(--text-muted); letter-spacing: 0; }
.tile .foot { margin-top: 8px; font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.grade {
  display: inline-block; font-weight: 650; font-size: 13px;
  padding: 2px 9px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border-strong);
}
.posture { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 550; }
.posture .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.posture[data-band="Hardened"] .dot { background: var(--st-good); }
.posture[data-band="Adequate"] .dot { background: var(--series-1); }
.posture[data-band="At Risk"]  .dot { background: var(--st-warning); }
.posture[data-band="Critical"] .dot { background: var(--st-critical); }

.uplift { color: var(--st-good); font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- severity KPI */
.sev-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); margin-top: 16px; }
.sev-tile {
  background: var(--surface-1); border: 1px solid var(--border);
  border-left: 3px solid var(--st-neutral);
  border-radius: 8px; padding: 12px 14px;
}
.sev-tile .n { font-size: 26px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
.sev-tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-top: 5px; display: flex; align-items: center; gap: 5px; }
.sev-tile[data-sev="Critical"] { border-left-color: var(--st-critical); }
.sev-tile[data-sev="High"]     { border-left-color: var(--st-serious); }
.sev-tile[data-sev="Medium"]   { border-left-color: var(--st-warning); }
.sev-tile[data-sev="Low"]      { border-left-color: var(--series-1); }
.sev-tile[data-sev="Info"]     { border-left-color: var(--st-neutral); }

/* ---------------------------------------------------------------- chart */
.legend { display: flex; gap: 18px; align-items: center; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 16px; flex-wrap: wrap; }
.legend .key { display: inline-flex; align-items: center; gap: 7px; }
.legend .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: minmax(140px, 200px) 1fr; gap: 16px; align-items: center; }
.bar-row .cat { font-size: 13px; color: var(--text-secondary); line-height: 1.3; }
.bar-row .cat .wt { color: var(--text-muted); font-size: 11px; display: block; }
.bar-stack { display: grid; gap: 2px; }              /* 2px surface gap between adjacent bars */
.bar-line  { display: grid; grid-template-columns: 1fr 34px; gap: 8px; align-items: center; }
.bar-track { position: relative; height: 13px; background: var(--grid); border-radius: 3px; }
.bar-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  border-radius: 0 4px 4px 0;                        /* 4px rounded data-end, anchored to baseline */
  min-width: 3px;
}
.bar-fill.s1 { background: var(--series-1); }
.bar-fill.s2 { background: var(--series-2); }
.bar-val {
  font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--text-secondary);
  text-align: right; white-space: nowrap;
}
.bar-row.na .bar-track { background: repeating-linear-gradient(135deg, var(--grid), var(--grid) 4px, transparent 4px, transparent 8px); }
.bar-na { font-size: 11.5px; color: var(--text-muted); font-style: italic; padding-left: 2px; }

/* ---------------------------------------------------------------- tables */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.ctr, th.ctr { text-align: center; }
td.id, th.id   { white-space: nowrap; width: 1%; }
.table-scroll { overflow-x: auto; }

.sev-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  border: 1px solid; white-space: nowrap;
}
.sev-pill[data-sev="Critical"] { color: var(--st-critical); border-color: var(--st-critical); }
.sev-pill[data-sev="High"]     { color: var(--st-serious);  border-color: var(--st-serious); }
.sev-pill[data-sev="Medium"]   { color: var(--st-warning);  border-color: var(--st-warning); }
.sev-pill[data-sev="Low"]      { color: var(--series-1);    border-color: var(--series-1); }
.sev-pill[data-sev="Info"]     { color: var(--text-muted);  border-color: var(--border-strong); }
:root[data-theme="dark"] .sev-pill[data-sev="Medium"],
:root:not([data-theme="light"]) .sev-pill[data-sev="Medium"] { color: var(--st-warning); }

.tag {
  display: inline-block; font-size: 11px; font-family: var(--mono);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-secondary); padding: 1px 6px; border-radius: 4px; margin: 1px 3px 1px 0;
  white-space: nowrap;
}
.conf { font-size: 11.5px; color: var(--text-secondary); }
.conf[data-c="Possible"] { color: var(--st-warning); font-weight: 600; }

/* ---------------------------------------------------------------- filters */
.toolbar {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  margin-bottom: 14px; padding: 12px 14px;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
}
.toolbar input[type="search"], .toolbar select {
  font: inherit; font-size: 13px; padding: 6px 10px;
  background: var(--surface-2); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 7px;
}
.toolbar input[type="search"] { min-width: 210px; flex: 1 1 210px; }
.chip {
  font: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer;
  background: var(--surface-2); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 999px;
}
.chip[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
.btn {
  font: inherit; font-size: 12.5px; padding: 6px 13px; cursor: pointer;
  background: var(--surface-2); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 7px;
}
.btn:hover { border-color: var(--border-strong); color: var(--text-primary); }
.count-note { font-size: 12.5px; color: var(--text-muted); margin-left: auto; }

/* ---------------------------------------------------------------- findings */
.finding {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 12px; box-shadow: var(--shadow);
  overflow: hidden;
}
.finding.done { opacity: .62; }
.finding > summary {
  list-style: none; cursor: pointer; padding: 14px 18px;
  display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center;
}
.finding > summary::-webkit-details-marker { display: none; }
.finding > summary:hover { background: var(--surface-2); }
.finding .fid { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
.finding .ftitle { display: block; font-weight: 550; font-size: 14.5px; line-height: 1.35; }
.finding .fmeta  { display: block; font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.finding .chev { color: var(--text-muted); font-size: 12px; }
.finding[open] .chev { transform: rotate(90deg); }
.chev { display: inline-block; transition: transform .12s ease; }

.fbody { padding: 4px 18px 20px; border-top: 1px solid var(--border); }
.fblock { margin-top: 16px; }
.fblock > .h {
  font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-muted); font-weight: 600; margin-bottom: 6px;
}
.loc {
  font-family: var(--mono); font-size: 12.5px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-left: 2px solid var(--border-strong);
  border-radius: 6px; padding: 8px 11px; margin-bottom: 6px; overflow-x: auto;
}
.loc .path { color: var(--series-1); font-weight: 600; }
.loc .code { display: block; margin-top: 4px; color: var(--text-secondary); white-space: pre; }

pre.code {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0;
  white-space: pre;
}
.diff { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (max-width: 800px) { .diff { grid-template-columns: 1fr; } }
.diff .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 5px; }
.diff .before pre.code { border-left: 2px solid var(--st-critical); }
.diff .after  pre.code { border-left: 2px solid var(--st-good); }

ol.steps { margin: 0; padding-left: 20px; }
ol.steps li { margin-bottom: 6px; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin-bottom: 5px; }

.verify {
  background: var(--surface-2); border: 1px solid var(--border);
  border-left: 3px solid var(--st-good);
  border-radius: 7px; padding: 10px 13px; font-size: 13.5px;
}
.warnbox {
  background: var(--surface-2); border: 1px solid var(--st-warning);
  border-left: 3px solid var(--st-warning);
  border-radius: 7px; padding: 10px 13px; font-size: 13.5px;
}
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; font-size: 13px; }
.kv .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }

.badge-nb {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--st-good); color: var(--st-good);
}
.badge-br {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--st-critical); color: var(--st-critical);
}

.chk { width: 16px; height: 16px; cursor: pointer; accent-color: var(--st-good); }

/* ---------------------------------------------------------------- roadmap */
.phase {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start;
  padding: 14px 0; border-bottom: 1px solid var(--border);
}
.phase:last-child { border-bottom: none; }
.phase .pnum {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: var(--series-1); color: #fff;
  display: grid; place-items: center; font-size: 13px; font-weight: 650;
}
.phase .pafter { font-size: 13px; color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- cost */
.cost-caveat {
  border-left: 3px solid var(--st-warning);
  background: var(--surface-2); border-radius: 7px;
  padding: 10px 13px; font-size: 13.5px; margin-bottom: 14px;
}
.cost-total { display: flex; gap: 28px; flex-wrap: wrap; align-items: baseline; margin-top: 14px; }
.cost-total .big { font-size: 30px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- misc */
footer.foot { color: var(--text-muted); font-size: 12.5px; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 40px; }
.empty { color: var(--text-muted); font-style: italic; padding: 18px; text-align: center; }
a { color: var(--series-1); }

/* ---------------------------------------------------------------- print */
@media print {
  :root { color-scheme: light; }
  body { background: #fff; font-size: 10.5pt; padding: 0; }
  .toolbar, .theme-toggle, .no-print { display: none !important; }
  .card, .tile, .finding, .sev-tile { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
  .finding { break-inside: avoid; }
  .fbody { display: block !important; }
  section { break-inside: avoid-page; }
  h2 { break-after: avoid; }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: none; padding: 0 8mm; }
}
</style>
</head>

        (has(s.posture) ? '<span class="posture" data-band="' + esc(s.posture) + '"><span class="dot"></span>' + esc(s.posture) + '</span>' : '') +
      '</div></div>';
  }
  /* Status colour never carries meaning alone - every severity ships an icon + label. */
  function sevIcon(s) {
    var g = { Critical: "&#9679;", High: "&#9650;", Medium: "&#9632;", Low: "&#9670;", Info: "&#9675;" };
    return '<span aria-hidden="true" style="color:' + sevVar(s) + '">' + (g[s] || "&#9675;") + '</span>';
  }
  function sevVar(s) {
    return { Critical: "var(--st-critical)", High: "var(--st-serious)", Medium: "var(--st-warning)",
             Low: "var(--series-1)", Info: "var(--text-muted)" }[s] || "var(--text-muted)";
  }

  /* ---------------------------------------------------------------- 2. categories */
  var cats = arr(scores.categories);
  if (cats.length) {
    out.push('<section id="categories"><h2>Category breakdown</h2><div class="card">');
    out.push(
      '<div class="legend">' +
        '<span class="key"><span class="swatch" style="background:var(--series-1)"></span>Current</span>' +
        (hasProjected ? '<span class="key"><span class="swatch" style="background:var(--series-2)"></span>Projected</span>' : '') +
        '<span class="key" style="color:var(--text-muted)">Scored 0-100 within each category; weight sets its share of the overall score.</span>' +
      '</div>'
    );
    out.push('<div class="bars">');
    cats.forEach(function (c) {
      var assessed = c.assessed !== false && has(c.current);
      out.push(
        '<div class="bar-row' + (assessed ? '' : ' na') + '">' +
          '<div class="cat">' + esc(c.name || c.key) +
            '<span class="wt">' + esc(c.owasp || "") + (has(c.weight) ? " &middot; weight " + c.weight : "") + '</span>' +
          '</div>' +
          '<div class="bar-stack">' +
            (assessed
              ? bar("s1", c.current, "Current " + c.current + "/100") +
                (hasProjected && has(c.projected) ? bar("s2", c.projected, "Projected " + c.projected + "/100") : "")
              : '<div class="bar-track"></div><div class="bar-na">Not assessed</div>') +
          '</div>' +
        '</div>'
      );
    });
    out.push('</div>');

    /* Table view - required relief for sub-3:1 marks, and the print-friendly form. */
    out.push('<div class="table-scroll" style="margin-top:22px"><table><thead><tr>' +
      '<th>Category</th><th>OWASP</th><th class="num">Weight</th><th class="num">Current</th>' +
      (hasProjected ? '<th class="num">Projected</th>' : '') + '<th>Note</th></tr></thead><tbody>');
    cats.forEach(function (c) {
      out.push('<tr><td>' + esc(c.name || c.key) + '</td><td>' + esc(c.owasp || "") + '</td>' +
        '<td class="num">' + (has(c.weight) ? c.weight : "-") + '</td>' +
        '<td class="num">' + (has(c.current) ? c.current : "n/a") + '</td>' +
        (hasProjected ? '<td class="num">' + (has(c.projected) ? c.projected : "n/a") + '</td>' : '') +
        '<td>' + esc(c.note || "") + '</td></tr>');
    });
    out.push('</tbody></table></div>');
    if (has(scores.profile)) {
      out.push('<p style="margin:14px 0 0;font-size:12.5px;color:var(--text-muted)">Weighting profile: <code>' +
        esc(scores.profile) + '</code>. Categories marked <em>not assessed</em> are excluded from the weighted average and their weight is redistributed.</p>');
    }
    out.push('</div></section>');
  }

  /* Value sits in its own column, so a 95-wide bar cannot push its label off the row. */
  function bar(cls, v, tip) {
    var w = Math.max(0, Math.min(100, Number(v) || 0));
    return '<div class="bar-line" title="' + esc(tip) + '">' +
             '<div class="bar-track">' +
               '<div class="bar-fill ' + cls + '" style="width:' + w + '%"></div>' +
             '</div>' +
             '<div class="bar-val">' + esc(String(v)) + '</div>' +
           '</div>';
  }

  /* ---------------------------------------------------------------- 3. strengths */
  var strengths = arr(DATA.strengths);
  if (strengths.length) {
    out.push('<section id="strengths"><h2>Controls verified present</h2><div class="card"><ul class="plain">');
    strengths.forEach(function (s) {
      out.push('<li><strong>' + esc(s.title) + '</strong>' + (has(s.detail) ? " &mdash; " + esc(s.detail) : "") + '</li>');
    });
    out.push('</ul><p style="margin:12px 0 0;font-size:12.5px;color:var(--text-muted)">' +
      'These are what the category scores are built on, and what remediation must not regress.</p></div></section>');
  }

  /* ---------------------------------------------------------------- 4. findings table */
  out.push('<section id="summary"><h2>Findings summary</h2>');
  if (!findings.length) {
    out.push('<div class="card"><p class="empty">No findings were recorded for this run. Check the Limitations section for what was and was not assessed.</p></div>');
  } else {
    out.push('<div class="card"><div class="table-scroll"><table><thead><tr>' +
      '<th class="id">#</th><th>Finding</th><th>Severity</th><th>Conf.</th><th>OWASP</th><th>Location</th>' +
      '<th class="ctr">Found</th><th class="ctr">Fixed</th></tr></thead><tbody>');
    findings.forEach(function (f) {
      var loc = arr(f.locations)[0];
      var more = arr(f.locations).length - 1;
      out.push('<tr>' +
        '<td class="id"><a href="#' + esc(f.id) + '" style="font-family:var(--mono);font-size:12px">' + esc(f.id) + '</a></td>' +
        '<td>' + esc(f.title) + '</td>' +
        '<td><span class="sev-pill" data-sev="' + esc(f.severity) + '">' + sevIcon(f.severity) + esc(f.severity) + '</span></td>' +
        '<td><span class="conf" data-c="' + esc(f.confidence) + '">' + esc(f.confidence || "-") + '</span></td>' +
        '<td>' + esc((f.owasp || "").split(" ")[0]) + '</td>' +
        '<td style="font-family:var(--mono);font-size:11.5px">' +
          (loc ? esc(loc.file) + (has(loc.line) ? ":" + loc.line : "") : "-") +
          (more > 0 ? ' <span style="color:var(--text-muted)">+' + more + '</span>' : '') + '</td>' +
        '<td class="ctr">' + (f.discovered === false ? "" : "&#10003;") + '</td>' +
        '<td class="ctr"><input class="chk" type="checkbox" data-fid="' + esc(f.id) + '"' + (f.remediated ? " checked" : "") + ' aria-label="Mark ' + esc(f.id) + ' remediated"></td>' +
      '</tr>');
    });
    out.push('</tbody></table></div>' +
      '<p style="margin:12px 0 0;font-size:12.5px;color:var(--text-muted)">' +
      'The <strong>Fixed</strong> column is a working checklist &mdash; tick items as they land. ' +
      'Your ticks are stored in this browser only; re-run the audit to produce a verified post-remediation score.</p></div>');
  }
  out.push('</section>');

  /* ---------------------------------------------------------------- 5. detail */
  if (findings.length) {
    out.push('<section id="detail"><h2>Detailed findings</h2>');
    out.push(
      '<div class="toolbar no-print">' +
        '<input type="search" id="q" placeholder="Search findings, files, CWE...">' +
        SEVS.map(function (s) { return '<button class="chip" type="button" data-sev="' + s + '" aria-pressed="false">' + s + '</button>'; }).join("") +
        '<button class="btn" id="expandAll" type="button">Expand all</button>' +
        '<button class="btn" id="copyList" type="button">Copy checklist</button>' +
        '<span class="count-note" id="countNote"></span>' +
      '</div>'
    );
    out.push('<div id="findingList">');
    findings.forEach(function (f) { out.push(findingCard(f)); });
    out.push('</div></section>');
  }

  function findingCard(f) {
    var r = f.remediation || {};
    var s = [];
    s.push('<details class="finding' + (f.remediated ? " done" : "") + '" id="' + esc(f.id) + '" data-sev="' + esc(f.severity) + '"' +
           ' data-blob="' + esc([f.id, f.title, f.evidence, f.risk, arr(f.cwe).join(" "),
                                 arr(f.locations).map(function (l) { return l.file; }).join(" "),
                                 f.owasp, f.category].filter(Boolean).join(" ").toLowerCase()) + '">');
    s.push('<summary>' +
      '<span class="fid">' + esc(f.id) + '</span>' +
      '<span class="sev-pill" data-sev="' + esc(f.severity) + '">' + sevIcon(f.severity) + esc(f.severity) + '</span>' +
      '<span><span class="ftitle">' + esc(f.title) + '</span>' +
        '<span class="fmeta">' + esc(f.owasp || "") +
          (has(f.confidence) ? " &middot; " + esc(f.confidence) : "") +
          (has(f.origin) ? " &middot; " + esc(f.origin) : "") +
          (has(f.exposure) ? " &middot; " + esc(f.exposure) : "") +
        '</span></span>' +
      '<span class="chev">&#9654;</span>' +
      '</summary>');

    s.push('<div class="fbody">');

    /* identifiers */
    var tags = [];
    arr(f.cwe).forEach(function (c) { tags.push('<span class="tag">' + esc(c) + '</span>'); });
    arr(f.attack).forEach(function (a) { tags.push('<span class="tag">ATT&amp;CK ' + esc(a.id) + (has(a.name) ? " " + esc(a.name) : "") + '</span>'); });
    if (f.nist) {
      arr(f.nist.ssdf).forEach(function (n) { tags.push('<span class="tag">SSDF ' + esc(n) + '</span>'); });
      arr(f.nist.sp80053).forEach(function (n) { tags.push('<span class="tag">800-53 ' + esc(n) + '</span>'); });
    }
    if (has(f.owaspCurrent)) tags.push('<span class="tag">' + esc(f.owaspCurrent) + '</span>');
    if (tags.length) s.push('<div class="fblock"><div class="h">Standards</div>' + tags.join("") + '</div>');

    if (has(f.risk))     s.push('<div class="fblock"><div class="h">Risk</div><p style="margin:0">' + esc(f.risk) + '</p></div>');
    if (has(f.evidence)) s.push('<div class="fblock"><div class="h">Evidence</div><p style="margin:0">' + esc(f.evidence) + '</p></div>');

    var locs = arr(f.locations);
    if (locs.length) {
      s.push('<div class="fblock"><div class="h">Location' + (locs.length > 1 ? "s (" + locs.length + ")" : "") + '</div>');
      locs.forEach(function (l) {
        s.push('<div class="loc"><span class="path">' + esc(l.file) + '</span>' +
               (has(l.line) ? '<span style="color:var(--text-muted)">:' + esc(l.line) + '</span>' : '') +
               (has(l.excerpt) ? '<span class="code">' + esc(l.excerpt) + '</span>' : '') + '</div>');
      });
      s.push('</div>');
    }

    if (f.impact) {
      s.push('<div class="fblock"><div class="h">Impact</div><div class="kv">' +
        ["confidentiality", "integrity", "availability"].map(function (k) {
          return has(f.impact[k]) ? '<div><div class="k">' + k + '</div>' + esc(f.impact[k]) + '</div>' : "";
        }).join("") + '</div></div>');
    }

    /* remediation */
    if (r && (has(r.summary) || arr(r.steps).length)) {
      s.push('<div class="fblock"><div class="h">Remediation' +
        (r.breakingChange ? ' <span class="badge-br">Breaking change</span>'
                          : (r.nonBreaking ? ' <span class="badge-nb">Non-breaking</span>' : '')) +
        (has(r.effort) ? ' <span class="tag">Effort ' + esc(r.effort) + '</span>' : '') +
        '</div>');
      if (r.breakingChange) {
        s.push('<div class="warnbox" style="margin-bottom:10px"><strong>This fix changes behaviour.</strong> ' +
               'Schedule it deliberately &mdash; it is not a drop-in change.</div>');
      }
      if (has(r.summary)) s.push('<p style="margin:0 0 10px">' + esc(r.summary) + '</p>');
      if (arr(r.steps).length) {
        s.push('<ol class="steps">' + arr(r.steps).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ol>');
      }
      if (has(r.codeBefore) || has(r.codeAfter)) {
        s.push('<div class="diff" style="margin-top:12px">' +
          (has(r.codeBefore) ? '<div class="before"><div class="lbl">Before</div><pre class="code">' + esc(r.codeBefore) + '</pre></div>' : '') +
          (has(r.codeAfter)  ? '<div class="after"><div class="lbl">After</div><pre class="code">'  + esc(r.codeAfter)  + '</pre></div>' : '') +
        '</div>');
      }
      s.push('</div>');
    }

    if (has(f.verification)) {
      s.push('<div class="fblock"><div class="h">Verification</div><div class="verify">' + esc(f.verification) + '</div></div>');
    }

    var refs = arr(f.references);
    if (refs.length) {
      s.push('<div class="fblock"><div class="h">References</div><ul class="plain">' +
        refs.map(function (x) {
          return "<li>" + (has(x.url) ? '<a href="' + esc(x.url) + '" rel="noreferrer noopener">' + esc(x.label || x.url) + "</a>"
                                      : esc(x.label || "")) + "</li>";
        }).join("") + '</ul></div>');
    }

    s.push('</div></details>');
    return s.join("");
  }

  /* ---------------------------------------------------------------- 6. roadmap */
  var roadmap = arr(DATA.roadmap);
  if (roadmap.length) {
    out.push('<section id="roadmap"><h2>Remediation roadmap</h2><div class="card">');
    roadmap.forEach(function (p) {
      out.push('<div class="phase">' +
        '<div class="pnum">' + esc(p.phase) + '</div>' +
        '<div><h3 style="font-size:15px;margin:0 0 4px">' + esc(p.name) + '</h3>' +
          '<div style="font-size:12.5px;color:var(--text-muted)">' +
            arr(p.findings).map(function (id) { return '<a href="#' + esc(id) + '" class="tag">' + esc(id) + '</a>'; }).join("") +
            (has(p.effort) ? ' <span class="tag">Effort ' + esc(p.effort) + '</span>' : '') +
          '</div>' +
          (has(p.rationale) ? '<p style="margin:8px 0 0;font-size:13.5px">' + esc(p.rationale) + '</p>' : '') +
        '</div>' +
        (has(p.scoreAfter) ? '<div class="pafter">&rarr; ' + esc(p.scoreAfter) + ' / 100</div>' : '<div></div>') +
      '</div>');
    });
    out.push('</div></section>');
  }

  /* ---------------------------------------------------------------- 7. cost */
  var cost = DATA.cost;
  if (cost) {
    out.push('<section id="cost"><h2>Analysis cost</h2><div class="card">');
    if (cost.source === "estimate") {
      out.push('<div class="cost-caveat"><strong>Estimated, not measured.</strong> ' +
        'Usage records were unavailable for this run, so the figures below are an approximation and should not be used for billing reconciliation.</div>');
    } else if (cost.source === "unavailable") {
      out.push('<p class="empty">Cost was not collected for this run.</p>');
    }

    if (cost.source !== "unavailable" && arr(cost.byModel).length) {
      out.push('<div class="table-scroll"><table><thead><tr>' +
        '<th>Model</th><th class="num">Msgs</th><th class="num">Input</th><th class="num">Cache write</th>' +
        '<th class="num">Cache read</th><th class="num">Output</th><th class="num">Total tokens</th><th class="num">Cost</th>' +
        '</tr></thead><tbody>');
      arr(cost.byModel).forEach(function (m) {
        var t = m.tokens || {};
        var cw = (t.cacheWrite5m || 0) + (t.cacheWrite1h || 0);
        out.push('<tr>' +
          '<td style="font-family:var(--mono);font-size:12px">' + esc(m.model) +
            (m.priced === false ? ' <span class="tag">unpriced</span>' : '') + '</td>' +
          '<td class="num">' + num(m.messages) + '</td>' +
          '<td class="num">' + num(t.input) + '</td>' +
          '<td class="num">' + num(cw) + '</td>' +
          '<td class="num">' + num(t.cacheRead) + '</td>' +
          '<td class="num">' + num(t.output) + '</td>' +
          '<td class="num">' + num(t.total) + '</td>' +
          '<td class="num">' + (m.costUSD ? money(m.costUSD.total) : "-") + '</td>' +
        '</tr>');
      });
      out.push('</tbody></table></div>');

      var tot = cost.totals || {};
      out.push('<div class="cost-total">' +
        '<div><div class="label" style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)">Total tokens</div>' +
          '<div class="big">' + num(tot.totalTokens) + '</div></div>' +
        '<div><div class="label" style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)">Estimated cost</div>' +
          '<div class="big">' + money(tot.totalCostUSD) + '</div></div>' +
        (has(cost.startedAt) && has(cost.finishedAt)
          ? '<div><div class="label" style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)">Window</div>' +
            '<div style="font-size:13px;color:var(--text-secondary);padding-top:8px">' + esc(cost.startedAt) + ' &rarr; ' + esc(cost.finishedAt) + '</div></div>'
          : '') +
      '</div>');

      out.push('<p style="margin:14px 0 0;font-size:12.5px;color:var(--text-muted)">' +
        (has(cost.note) ? esc(cost.note) + " " : "") +
        (cost.unpricedModels ? '<strong>' + cost.unpricedModels + ' model(s) had no published rate and are excluded from the dollar total.</strong> ' : '') +
        'Cache reads are billed well below input rate, which is why total tokens and total cost do not move together.' +
        '</p>');
    }
    out.push('</div></section>');
  }

  /* ---------------------------------------------------------------- 8. evidence */
  var ev = arr(DATA.evidenceLog);
  if (ev.length) {
    out.push('<section id="evidence"><h2>Scan evidence</h2><div class="card">' +
      '<p style="font-size:13px;color:var(--text-secondary);margin-top:0">' +
      'What was checked, so that "no finding" can be told apart from "not checked".</p>' +
      '<div class="table-scroll"><table><thead><tr><th>Check</th><th>Rule</th><th>Query</th><th>Result</th><th>Conclusion</th></tr></thead><tbody>');
    ev.forEach(function (e) {
      out.push('<tr><td>' + esc(e.check) + '</td>' +
        '<td style="font-family:var(--mono);font-size:11.5px">' + esc(e.ruleId || "") + '</td>' +
        '<td style="font-family:var(--mono);font-size:11.5px">' + esc(e.query || "") + '</td>' +
        '<td>' + esc(e.result || "") + '</td><td>' + esc(e.conclusion || "") + '</td></tr>');
    });
    out.push('</tbody></table></div></div></section>');
  }

  /* ---------------------------------------------------------------- 9. limitations */
  var lim = arr(DATA.limitations);
  if (lim.length) {
    out.push('<section id="limitations"><h2>Limitations &amp; scope</h2><div class="card"><ul class="plain">' +
      lim.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") +
      '</ul></div></section>');
  }

  out.push('<footer class="foot">' +
    esc(title) + (has(meta.scanDate) ? " &middot; " + esc(meta.scanDate) : "") +
    ' &middot; Generated by the <code>security-audit</code> skill. ' +
    'Static analysis findings require human confirmation before they are treated as accepted risk or closed.' +
    '</footer>');

  out.push('</div>');
  document.getElementById("root").innerHTML = out.join("");

  /* ---------------------------------------------------------------- behaviour */
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* file:// or blocked - fine */ } }
  };

  /* theme toggle - wins over the OS setting in both directions */
  var btn = document.getElementById("themeBtn");
  var saved = store.get("sa-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  if (btn) btn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    if (!cur) cur = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    store.set("sa-theme", next);
  });

  /* remediated checkboxes */
  var key = "sa-fixed:" + (meta.projectName || "") + ":" + (meta.scanDate || "");
  var fixed = {};
  try { fixed = JSON.parse(store.get(key) || "{}"); } catch (e) { fixed = {}; }
  document.querySelectorAll(".chk").forEach(function (cb) {
    var id = cb.getAttribute("data-fid");
    if (fixed[id]) cb.checked = true;
    applyFixed(id, cb.checked);
    cb.addEventListener("change", function () {
      fixed[id] = cb.checked;
      store.set(key, JSON.stringify(fixed));
      applyFixed(id, cb.checked);
    });
  });
  function applyFixed(id, on) {
    var card = document.getElementById(id);
    if (card) card.classList.toggle("done", !!on);
  }

  /* filters */
  var q = document.getElementById("q");
  var chips = Array.prototype.slice.call(document.querySelectorAll(".chip[data-sev]"));
  var cards = Array.prototype.slice.call(document.querySelectorAll(".finding"));
  var note = document.getElementById("countNote");

  function applyFilter() {
    var term = (q && q.value || "").trim().toLowerCase();
    var on = chips.filter(function (c) { return c.getAttribute("aria-pressed") === "true"; })
                  .map(function (c) { return c.getAttribute("data-sev"); });
    var shown = 0;
    cards.forEach(function (card) {
      var okSev = !on.length || on.indexOf(card.getAttribute("data-sev")) !== -1;
      var okTxt = !term || (card.getAttribute("data-blob") || "").indexOf(term) !== -1;
      var vis = okSev && okTxt;
      card.hidden = !vis;
      if (vis) shown++;
    });
    if (note) note.textContent = shown + " of " + cards.length + " shown";
  }
  chips.forEach(function (c) {
    c.addEventListener("click", function () {
      c.setAttribute("aria-pressed", c.getAttribute("aria-pressed") === "true" ? "false" : "true");
      applyFilter();
    });
  });
  if (q) q.addEventListener("input", applyFilter);
  applyFilter();

  var exp = document.getElementById("expandAll");
  if (exp) exp.addEventListener("click", function () {
    var anyClosed = cards.some(function (c) { return !c.open && !c.hidden; });
    cards.forEach(function (c) { if (!c.hidden) c.open = anyClosed; });
    exp.textContent = anyClosed ? "Collapse all" : "Expand all";
  });

  /* copy checklist as markdown */
  var copy = document.getElementById("copyList");
  if (copy) copy.addEventListener("click", function () {
    var lines = ["# " + title, ""];
    findings.forEach(function (f) {
      var cb = document.querySelector('.chk[data-fid="' + f.id + '"]');
      var done = cb && cb.checked;
      var loc = arr(f.locations)[0];
      lines.push("- [" + (done ? "x" : " ") + "] **" + f.id + "** (" + f.severity + ", " + (f.owasp || "") + ") " +
                 f.title + (loc ? "  \n      " + loc.file + (has(loc.line) ? ":" + loc.line : "") : ""));
    });
    var text = lines.join("\n");
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(); done(); });
    } else { fallback(); done(); }
    function done() {
      copy.textContent = "Copied";
      setTimeout(function () { copy.textContent = "Copy checklist"; }, 1600);
    }
  });

  /* expand a finding when linked to directly */
  window.addEventListener("hashchange", openHash);
  openHash();
  function openHash() {
    var h = location.hash.slice(1);
    if (!h) return;
    var t = document.getElementById(h);
    if (t && t.tagName === "DETAILS") { t.hidden = false; t.open = true; t.scrollIntoView({ block: "start" }); }
  }

  /* print: expand everything so nothing is hidden in the PDF */
  window.addEventListener("beforeprint", function () {
    cards.forEach(function (c) { c.open = true; });
  });
})();
</script>
</body>
</html>
