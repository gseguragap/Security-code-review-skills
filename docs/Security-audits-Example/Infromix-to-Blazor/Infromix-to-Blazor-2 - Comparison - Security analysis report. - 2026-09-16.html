<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migration security comparison report</title>
<style>
/* ============================================================================
   Security analysis report - self-contained stylesheet.
   No external fonts, no CDN, no network. Opens from disk in any browser.
   Palette: dataviz reference instance (categorical slots 1-2 + status roles),
   used verbatim - the documented, validated default.
   ========================================================================= */

:root {
  color-scheme: light;

  --surface-0:      #f4f4f1;   /* page ground   */
  --surface-1:      #fcfcfb;   /* card / chart  */
  --surface-2:      #eeeeea;   /* inset, code   */
  --border:         #dcdcd6;
  --border-strong:  #c3c2b7;

  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #78776f;

  /* categorical - fixed order, never cycled */
  --series-1:       #2a78d6;   /* Current   */
  --series-2:       #eb6834;   /* Projected */

  /* status - reserved roles, always paired with an icon + label */
  --st-good:        #0ca30c;
  --st-warning:     #fab219;
  --st-serious:     #ec835a;
  --st-critical:    #d03b3b;
  --st-neutral:     #78776f;

  --grid:           #e6e6e1;
  --shadow:         0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  --radius:         10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0:      #121211;
    --surface-1:      #1a1a19;
    --surface-2:      #232322;
    --border:         #33332f;
    --border-strong:  #4a4a45;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #96958c;
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --grid:           #2b2b28;
    --shadow:         0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0:      #121211;
  --surface-1:      #1a1a19;
  --surface-2:      #232322;
  --border:         #33332f;
  --border-strong:  #4a4a45;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #96958c;
  --series-1:       #3987e5;
  --series-2:       #d95926;
  --grid:           #2b2b28;
  --shadow:         0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--surface-0);
  color: var(--text-primary);
  font: 15px/1.6 var(--sans);
  padding: 0 0 5rem;
}
img { max-width: 100%; }
[hidden] { display: none !important; }

.wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

/* ---------------------------------------------------------------- header */
header.masthead {
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  padding: 28px 0 22px;
  margin-bottom: 28px;
}
.masthead h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.25; letter-spacing: -.02em; }
.masthead .sub { color: var(--text-secondary); font-size: 14px; margin: 0; }
.meta-grid {
  display: grid; gap: 10px 28px; margin-top: 18px;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  font-size: 13px;
}
.meta-grid dt { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.meta-grid dd { margin: 0; color: var(--text-primary); word-break: break-word; }

.theme-toggle {
  position: absolute; top: 20px; right: 24px;
  background: var(--surface-2); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 14px; font: inherit; font-size: 12px; cursor: pointer;
}
.theme-toggle:hover { border-color: var(--border-strong); color: var(--text-primary); }
.masthead { position: relative; }

/* ---------------------------------------------------------------- sections */
section { margin: 0 0 38px; }
h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-muted); margin: 0 0 14px; font-weight: 600;
}
h3 { font-size: 17px; margin: 0 0 10px; letter-spacing: -.01em; }
p  { margin: 0 0 12px; }

.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
}

/* ---------------------------------------------------------------- score tiles */
.score-row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.tile {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
}
.tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 6px; }
.tile .hero { font-size: 40px; line-height: 1; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tile .hero .of { font-size: 17px; font-weight: 400; color: var(--text-muted); letter-spacing: 0; }
.tile .foot { margin-top: 8px; font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.grade {
  display: inline-block; font-weight: 650; font-size: 13px;
  padding: 2px 9px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border-strong);
}
.posture { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 550; }
.posture .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.posture[data-band="Hardened"] .dot { background: var(--st-good); }
.posture[data-band="Adequate"] .dot { background: var(--series-1); }
.posture[data-band="At Risk"]  .dot { background: var(--st-warning); }
.posture[data-band="Critical"] .dot { background: var(--st-critical); }

.uplift { color: var(--st-good); font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- severity KPI */
.sev-row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); margin-top: 16px; }
.sev-tile {
  background: var(--surface-1); border: 1px solid var(--border);
  border-left: 3px solid var(--st-neutral);
  border-radius: 8px; padding: 12px 14px;
}
.sev-tile .n { font-size: 26px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
.sev-tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-top: 5px; display: flex; align-items: center; gap: 5px; }
.sev-tile[data-sev="Critical"] { border-left-color: var(--st-critical); }
.sev-tile[data-sev="High"]     { border-left-color: var(--st-serious); }
.sev-tile[data-sev="Medium"]   { border-left-color: var(--st-warning); }
.sev-tile[data-sev="Low"]      { border-left-color: var(--series-1); }
.sev-tile[data-sev="Info"]     { border-left-color: var(--st-neutral); }

/* ---------------------------------------------------------------- chart */
.legend { display: flex; gap: 18px; align-items: center; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 16px; flex-wrap: wrap; }
.legend .key { display: inline-flex; align-items: center; gap: 7px; }
.legend .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: minmax(140px, 200px) 1fr; gap: 16px; align-items: center; }
.bar-row .cat { font-size: 13px; color: var(--text-secondary); line-height: 1.3; }
.bar-row .cat .wt { color: var(--text-muted); font-size: 11px; display: block; }
.bar-stack { display: grid; gap: 2px; }              /* 2px surface gap between adjacent bars */
.bar-line  { display: grid; grid-template-columns: 1fr 34px; gap: 8px; align-items: center; }
.bar-track { position: relative; height: 13px; background: var(--grid); border-radius: 3px; }
.bar-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  border-radius: 0 4px 4px 0;                        /* 4px rounded data-end, anchored to baseline */
  min-width: 3px;
}
.bar-fill.s1 { background: var(--series-1); }
.bar-fill.s2 { background: var(--series-2); }
.bar-val {
  font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--text-secondary);
  text-align: right; white-space: nowrap;
}
.bar-row.na .bar-track { background: repeating-linear-gradient(135deg, var(--grid), var(--grid) 4px, transparent 4px, transparent 8px); }
.bar-na { font-size: 11.5px; color: var(--text-muted); font-style: italic; padding-left: 2px; }

/* ---------------------------------------------------------------- tables */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.ctr, th.ctr { text-align: center; }
td.id, th.id   { white-space: nowrap; width: 1%; }
.table-scroll { overflow-x: auto; }

.sev-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  border: 1px solid; white-space: nowrap;
}
.sev-pill[data-sev="Critical"] { color: var(--st-critical); border-color: var(--st-critical); }
.sev-pill[data-sev="High"]     { color: var(--st-serious);  border-color: var(--st-serious); }
.sev-pill[data-sev="Medium"]   { color: var(--st-warning);  border-color: var(--st-warning); }
.sev-pill[data-sev="Low"]      { color: var(--series-1);    border-color: var(--series-1); }
.sev-pill[data-sev="Info"]     { color: var(--text-muted);  border-color: var(--border-strong); }
:root[data-theme="dark"] .sev-pill[data-sev="Medium"],
:root:not([data-theme="light"]) .sev-pill[data-sev="Medium"] { color: var(--st-warning); }

.tag {
  display: inline-block; font-size: 11px; font-family: var(--mono);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-secondary); padding: 1px 6px; border-radius: 4px; margin: 1px 3px 1px 0;
  white-space: nowrap;
}
.conf { font-size: 11.5px; color: var(--text-secondary); }
.conf[data-c="Possible"] { color: var(--st-warning); font-weight: 600; }

/* ---------------------------------------------------------------- filters */
.toolbar {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  margin-bottom: 14px; padding: 12px 14px;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
}
.toolbar input[type="search"], .toolbar select {
  font: inherit; font-size: 13px; padding: 6px 10px;
  background: var(--surface-2); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 7px;
}
.toolbar input[type="search"] { min-width: 210px; flex: 1 1 210px; }
.chip {
  font: inherit; font-size: 12px; padding: 5px 11px; cursor: pointer;
  background: var(--surface-2); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 999px;
}
.chip[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
.btn {
  font: inherit; font-size: 12.5px; padding: 6px 13px; cursor: pointer;
  background: var(--surface-2); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 7px;
}
.btn:hover { border-color: var(--border-strong); color: var(--text-primary); }
.count-note { font-size: 12.5px; color: var(--text-muted); margin-left: auto; }

/* ---------------------------------------------------------------- findings */
.finding {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 12px; box-shadow: var(--shadow);
  overflow: hidden;
}
.finding.done { opacity: .62; }
.finding > summary {
  list-style: none; cursor: pointer; padding: 14px 18px;
  display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center;
}
.finding > summary::-webkit-details-marker { display: none; }
.finding > summary:hover { background: var(--surface-2); }
.finding .fid { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
.finding .ftitle { display: block; font-weight: 550; font-size: 14.5px; line-height: 1.35; }
.finding .fmeta  { display: block; font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.finding .chev { color: var(--text-muted); font-size: 12px; }
.finding[open] .chev { transform: rotate(90deg); }
.chev { display: inline-block; transition: transform .12s ease; }

.fbody { padding: 4px 18px 20px; border-top: 1px solid var(--border); }
.fblock { margin-top: 16px; }
.fblock > .h {
  font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-muted); font-weight: 600; margin-bottom: 6px;
}
.loc {
  font-family: var(--mono); font-size: 12.5px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-left: 2px solid var(--border-strong);
  border-radius: 6px; padding: 8px 11px; margin-bottom: 6px; overflow-x: auto;
}
.loc .path { color: var(--series-1); font-weight: 600; }
.loc .code { display: block; margin-top: 4px; color: var(--text-secondary); white-space: pre; }

pre.code {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0;
  white-space: pre;
}
.diff { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (max-width: 800px) { .diff { grid-template-columns: 1fr; } }
.diff .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 5px; }
.diff .before pre.code { border-left: 2px solid var(--st-critical); }
.diff .after  pre.code { border-left: 2px solid var(--st-good); }

ol.steps { margin: 0; padding-left: 20px; }
ol.steps li { margin-bottom: 6px; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin-bottom: 5px; }

.verify {
  background: var(--surface-2); border: 1px solid var(--border);
  border-left: 3px solid var(--st-good);
  border-radius: 7px; padding: 10px 13px; font-size: 13.5px;
}
.warnbox {
  background: var(--surface-2); border: 1px solid var(--st-warning);
  border-left: 3px solid var(--st-warning);
  border-radius: 7px; padding: 10px 13px; font-size: 13.5px;
}
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; font-size: 13px; }
.kv .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }

.badge-nb {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--st-good); color: var(--st-good);
}
.badge-br {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--st-critical); color: var(--st-critical);
}

.chk { width: 16px; height: 16px; cursor: pointer; accent-color: var(--st-good); }

/* ---------------------------------------------------------------- roadmap */
.phase {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start;
  padding: 14px 0; border-bottom: 1px solid var(--border);
}
.phase:last-child { border-bottom: none; }
.phase .pnum {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: var(--series-1); color: #fff;
  display: grid; place-items: center; font-size: 13px; font-weight: 650;
}
.phase .pafter { font-size: 13px; color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- cost */
.cost-caveat {
  border-left: 3px solid var(--st-warning);
  background: var(--surface-2); border-radius: 7px;
  padding: 10px 13px; font-size: 13.5px; margin-bottom: 14px;
}
.cost-total { display: flex; gap: 28px; flex-wrap: wrap; align-items: baseline; margin-top: 14px; }
.cost-total .big { font-size: 30px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- misc */
footer.foot { color: var(--text-muted); font-size: 12.5px; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 40px; }
.empty { color: var(--text-muted); font-style: italic; padding: 18px; text-align: center; }
a { color: var(--series-1); }

/* ---------------------------------------------------------------- print */
@media print {
  :root { color-scheme: light; }
  body { background: #fff; font-size: 10.5pt; padding: 0; }
  .toolbar, .theme-toggle, .no-print { display: none !important; }
  .card, .tile, .finding, .sev-tile { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
  .finding { break-inside: avoid; }
  .fbody { display: block !important; }
  section { break-inside: avoid-page; }
  h2 { break-after: avoid; }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: none; padding: 0 8mm; }
}

/* ============================================================================
   Comparison-report additions. Everything above is shared verbatim with the
   security-audit report stylesheet so the three reports in a project folder
   read as one document set.
   ========================================================================= */

/* Bucket is the primary axis of this report, so it gets a reserved colour role
   each - always paired with a text label, never colour alone. */
:root {
  --bk-resolved:   #0ca30c;   /* gone in the modernized tree      */
  --bk-inherited:  #fab219;   /* carried across the migration     */
  --bk-introduced: #d03b3b;   /* created by the migration         */
  --bk-newsurface: #2a78d6;   /* new architecture, new exposure   */
  --bk-nocompare:  #78776f;   /* no counterpart to compare against */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bk-resolved: #3cc13c; --bk-inherited: #ffc93f; --bk-introduced: #e85c5c;
    --bk-newsurface: #3987e5; --bk-nocompare: #96958c;
  }
}
:root[data-theme="dark"] {
  --bk-resolved: #3cc13c; --bk-inherited: #ffc93f; --bk-introduced: #e85c5c;
  --bk-newsurface: #3987e5; --bk-nocompare: #96958c;
}

/* ------------------------------------------------------------ bucket tiles */
.bucket-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 8px; }
.bk-tile {
  background: var(--surface-1); border: 1px solid var(--border); border-left: 4px solid var(--bk-nocompare);
  border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
}
.bk-tile .n { font-size: 26px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
.bk-tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); margin-top: 5px; display: flex; align-items: center; gap: 5px; }
.bk-tile .d { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.45; }
.bk-tile[data-bucket="resolved"]   { border-left-color: var(--bk-resolved); }
.bk-tile[data-bucket="inherited"]  { border-left-color: var(--bk-inherited); }
.bk-tile[data-bucket="introduced"] { border-left-color: var(--bk-introduced); }
.bk-tile[data-bucket="new-surface"]{ border-left-color: var(--bk-newsurface); }
.bk-tile[data-bucket="not-comparable"] { border-left-color: var(--bk-nocompare); }

.bk-pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .05em; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--border-strong); color: var(--text-primary); background: var(--surface-2);
}
.bk-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bk-nocompare); }
.bk-pill[data-bucket="resolved"]    .dot { background: var(--bk-resolved); }
.bk-pill[data-bucket="inherited"]   .dot { background: var(--bk-inherited); }
.bk-pill[data-bucket="introduced"]  .dot { background: var(--bk-introduced); }
.bk-pill[data-bucket="new-surface"] .dot { background: var(--bk-newsurface); }

/* --------------------------------------------------- side-by-side compare */
.side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
.side { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.side h5 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); font-weight: 650; }
.side .none { color: var(--text-muted); font-style: italic; font-size: 13px; }
.side-arrow { display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 20px; }
@media (max-width: 760px) { .side-by-side { grid-template-columns: 1fr; } }

/* ------------------------------------------------------------ score deltas */
.delta { font-variant-numeric: tabular-nums; font-weight: 650; }
.delta.up   { color: var(--st-good); }
.delta.down { color: var(--st-critical); }
.delta.flat { color: var(--text-muted); }
.cat-delta-table td.num { text-align: right; }

/* the two-tone category bar: legacy vs modernized on one track */
.cmp-bar-row { display: grid; grid-template-columns: 200px 1fr 64px; gap: 12px; align-items: center; margin-bottom: 9px; }
.cmp-track { position: relative; height: 22px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.cmp-seg { position: absolute; top: 0; height: 11px; border-radius: 3px; }
.cmp-seg.lg { top: 0; background: var(--st-neutral); }
.cmp-seg.md { top: 11px; background: var(--series-1); }
@media (max-width: 700px) { .cmp-bar-row { grid-template-columns: 120px 1fr 54px; } }

/* ------------------------------------------------------- coverage warnings */
.coverage { border-left: 4px solid var(--st-warning); background: var(--surface-2);
  border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.coverage h4 { margin: 0 0 6px; font-size: 15px; }

      '<p>The embedded comparison JSON is not valid: <code></code></p>' +
      '<p style="color:var(--text-muted)">Validate ' +
      '<code>.security-audit/comparison/comparison.json</code> before concatenating the report.</p>' +
      '</div></div>';
    document.querySelector("#root code").textContent = err.message;
    return;
  }

  /* ---------------------------------------------------------------- utils */
  var SEVS = ["Critical", "High", "Medium", "Low", "Info"];
  var SEV_RANK = { Critical: 0, High: 1, Medium: 2, Low: 3, Info: 4 };

  var BUCKETS = [
    { key: "introduced",     label: "Introduced",     blurb: "Created by the modernization. Absent from the legacy system." },
    { key: "inherited",      label: "Inherited",      blurb: "Present before and after. The migration carried the flaw across." },
    { key: "new-surface",    label: "New surface",    blurb: "New architecture, new exposure. No legacy equivalent could exist." },
    { key: "resolved",       label: "Resolved",       blurb: "Present in the legacy system, gone in the modernized one." },
    { key: "not-comparable", label: "Not comparable", blurb: "No counterpart existed to compare against." }
  ];
  var BK = {};
  BUCKETS.forEach(function (b) { BK[b.key] = b; });
  /* Buckets an engineer still has to act on, in the order they should act. */
  var ACTIONABLE = ["introduced", "inherited", "new-surface"];

  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function has(x) { return x !== null && x !== undefined && x !== ""; }
  function num(n, d) {
    return (typeof n === "number" && isFinite(n))
      ? n.toLocaleString(undefined, { maximumFractionDigits: d === undefined ? 0 : d }) : "-";
  }
  function money(n) {
    if (typeof n !== "number" || !isFinite(n)) return "-";
    return "$" + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: n < 1 ? 4 : 2 });
  }
  function kv(k, v) {
    if (!has(v)) return "";
    return "<div><dt>" + esc(k) + "</dt><dd>" + v + "</dd></div>";
  }
  function sevIcon(s) {
    var g = { Critical: "&#9679;", High: "&#9650;", Medium: "&#9632;", Low: "&#9670;", Info: "&#9675;" };
    return '<span class="sev-pill" data-sev="' + esc(s) + '">' + (g[s] || "&#9675;") + '</span>';
  }
  function bkPill(b) {
    var d = BK[b];
    return '<span class="bk-pill" data-bucket="' + esc(b) + '"><span class="dot"></span>' +
           esc(d ? d.label : b) + '</span>';
  }
  function deltaSpan(v, betterIsUp) {
    if (typeof v !== "number" || !isFinite(v)) return '<span class="delta flat">-</span>';
    var good = (v > 0) === (betterIsUp !== false);
    var cls = v === 0 ? "flat" : (good ? "up" : "down");
    return '<span class="delta ' + cls + '">' + (v > 0 ? "+" : "") + num(v, 1) + '</span>';
  }

  var meta    = DATA.meta || {};
  var scores  = DATA.scores || {};
  var legacyS = scores.legacy || null;
  var modernS = scores.modernized || null;

  var items = arr(DATA.items).slice().sort(function (a, b) {
    var ai = ACTIONABLE.indexOf(a.bucket), bi = ACTIONABLE.indexOf(b.bucket);
    if (ai < 0) { ai = 9; }
    if (bi < 0) { bi = 9; }
    if (ai !== bi) return ai - bi;
    var as = SEV_RANK[a.severity], bs = SEV_RANK[b.severity];
    if (as === undefined) { as = 9; }
    if (bs === undefined) { bs = 9; }
    if (as !== bs) return as - bs;
    return String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
  });

  var out = [];

  /* ---------------------------------------------------------------- header */
  var title = (meta.projectName || "Untitled project") + " - Migration security comparison";
  document.title = title;

  var lg = meta.legacy || {};
  var md = meta.modernized || {};

  out.push(
    '<header class="masthead"><div class="wrap">' +
      '<button class="theme-toggle no-print" id="themeBtn" type="button">Theme</button>' +
      '<h1>' + esc(title) + '</h1>' +
      '<p class="sub">' + esc(meta.subtitle ||
         "Legacy vs Modernized - what the migration fixed, carried across, and created") + '</p>' +
      '<dl class="meta-grid">' +
        kv("Legacy", esc(lg.stack || "-") +
            (has(lg.targetPath) ? '<br><span style="color:var(--text-muted)">' + esc(lg.targetPath) + '</span>' : "")) +
        kv("Modernized", esc(md.stack || "-") +
            (has(md.targetPath) ? '<br><span style="color:var(--text-muted)">' + esc(md.targetPath) + '</span>' : "")) +
        kv("Date", meta.scanDate) +
        kv("Analyst", meta.analyst) +
        kv("Depth", meta.depth) +
        kv("Findings compared", has(meta.comparedCount) ? num(meta.comparedCount) : null) +
      '</dl>' +
    '</div></header>'
  );

  out.push('<div class="wrap">');

  /* ------------------------------------------------------------- 0. verdict */
  if (has(meta.verdict)) {
    out.push(
      '<section id="verdict"><h2>Verdict</h2>' +
      '<div class="card"><p style="margin:0;font-size:15.5px;line-height:1.65">' +
      esc(meta.verdict) + '</p></div></section>'
    );
  }

  /* ------------------------------------------------------------- 1. scores */
  function scoreTile(label, s, foot) {
    if (!s) {
      return '<div class="tile"><div class="label">' + esc(label) + '</div>' +
             '<div class="hero" style="color:var(--text-muted)">n/a</div>' +
             '<div class="foot">Not assessed</div></div>';
    }
    return '<div class="tile">' +
      '<div class="label">' + esc(label) + '</div>' +
      '<div class="hero">' + esc(String(s.score)) + '<span class="of"> / 100</span></div>' +
      '<div class="foot">' +
        (has(s.grade) ? '<span class="grade">' + esc(s.grade) + '</span>' : "") +
        (has(s.posture) ? '<span class="posture" data-band="' + esc(s.posture) + '"><span class="dot"></span>' +
                          esc(s.posture) + '</span>' : "") +
      '</div>' +
      (has(foot) ? '<div class="foot" style="color:var(--text-muted);font-size:12px">' + esc(foot) + '</div>' : "") +
      '</div>';
  }

  out.push('<section id="dashboard"><h2>Security posture, before and after</h2><div class="score-row">');
  out.push(scoreTile("Legacy", legacyS, "Pre-migration baseline"));
  out.push(scoreTile("Modernized", modernS, "Post-migration, as audited"));
  if (legacyS && modernS && typeof legacyS.score === "number" && typeof modernS.score === "number") {
    var d = modernS.score - legacyS.score;
    out.push(
      '<div class="tile"><div class="label">Migration delta</div>' +
      '<div class="hero">' + deltaSpan(d) + '</div>' +
      '<div class="foot">points of security posture ' + (d >= 0 ? "gained" : "lost") +
      ' in the migration</div></div>'
    );
  }
  if (scores.projected && has(scores.projected.score)) {
    out.push(scoreTile("Projected", scores.projected, "Modernized, after the plan below"));
  }
  out.push('</div>');
  if (has(meta.scoreCaveat)) {
    out.push('<div class="warnbox" style="margin-top:14px">' + esc(meta.scoreCaveat) + '</div>');
  }
  out.push('</section>');

  /* ------------------------------------------------------------ 2. buckets */
  var counts = {};
  BUCKETS.forEach(function (b) { counts[b.key] = 0; });
  items.forEach(function (i) { if (counts[i.bucket] !== undefined) counts[i.bucket]++; });

  out.push('<section id="buckets"><h2>What the migration did to the security posture</h2>');
  out.push('<div class="bucket-row">');
  BUCKETS.forEach(function (b) {
    out.push(
      '<div class="bk-tile" data-bucket="' + b.key + '">' +
        '<div class="n">' + counts[b.key] + '</div>' +
        '<div class="k">' + esc(b.label) + '</div>' +
        '<div class="d">' + esc(b.blurb) + '</div>' +
      '</div>'
    );
  });
  out.push('</div>');

  var sevL = {}, sevM = {};
  SEVS.forEach(function (s) { sevL[s] = 0; sevM[s] = 0; });
  items.forEach(function (i) {
    if (i.legacy && sevL[i.legacy.severity] !== undefined) sevL[i.legacy.severity]++;
    if (i.modernized && sevM[i.modernized.severity] !== undefined) sevM[i.modernized.severity]++;
  });
  out.push(
    '<h3>Findings by severity, on each side</h3>' +
    '<div class="table-scroll"><table class="cat-delta-table"><thead><tr>' +
    '<th>Severity</th><th class="num">Legacy</th><th class="num">Modernized</th><th class="num">Change</th>' +
    '</tr></thead><tbody>' +
    SEVS.map(function (s) {
      return '<tr><td>' + sevIcon(s) + ' ' + esc(s) + '</td>' +
        '<td class="num">' + sevL[s] + '</td>' +
        '<td class="num">' + sevM[s] + '</td>' +
        '<td class="num">' + deltaSpan(sevM[s] - sevL[s], false) + '</td></tr>';
    }).join("") +
    '</tbody></table></div>' +
    '<p class="count-note">Counts are of compared findings on each side. A finding present in both ' +
    'codebases is counted once per side, so the two columns are directly comparable.</p>'
  );
  out.push('</section>');

  /* -------------------------------------------------- 3. category compare */
  var cats = arr(scores.categories).filter(function (c) {
    return has(c.legacy) || has(c.modernized);
  });
  if (cats.length) {
    out.push('<section id="categories"><h2>Category scores, legacy vs modernized</h2><div class="card">');
    out.push(
      '<div class="legend">' +
        '<span class="key"><span class="swatch" style="background:var(--st-neutral)"></span>Legacy</span>' +
        '<span class="key"><span class="swatch" style="background:var(--series-1)"></span>Modernized</span>' +
        '<span class="key" style="color:var(--text-muted)">Scored 0-100 within each category; ' +
        'weight sets its share of the overall score.</span>' +
      '</div><div style="margin-top:14px">'
    );
    cats.forEach(function (c) {
      var l = typeof c.legacy === "number" ? c.legacy : null;
      var m = typeof c.modernized === "number" ? c.modernized : null;
      out.push(
        '<div class="cmp-bar-row">' +
          '<div>' + esc(c.name || c.key) +
            (has(c.weight) ? ' <span style="color:var(--text-muted);font-size:12px">w' + esc(c.weight) + '</span>' : "") +
          '</div>' +
          '<div class="cmp-track">' +
            (l !== null ? '<div class="cmp-seg lg" style="width:' + Math.max(0, Math.min(100, l)) + '%"></div>' : "") +
            (m !== null ? '<div class="cmp-seg md" style="width:' + Math.max(0, Math.min(100, m)) + '%"></div>' : "") +
          '</div>' +
          '<div class="num" style="text-align:right">' +
            (l !== null && m !== null ? deltaSpan(m - l) : '<span class="delta flat">-</span>') +
          '</div>' +
        '</div>' +
        (has(c.note) ? '<p class="count-note" style="margin:-4px 0 10px 0">' + esc(c.note) + '</p>' : "")
      );
    });
    out.push('</div>');
    out.push(
      '<div class="table-scroll" style="margin-top:18px"><table class="cat-delta-table"><thead><tr>' +
      '<th>Category</th><th class="num">Weight</th><th class="num">Legacy</th>' +
      '<th class="num">Modernized</th><th class="num">Change</th>' +
      '</tr></thead><tbody>' +
      cats.map(function (c) {
        var l = typeof c.legacy === "number" ? c.legacy : null;
        var m = typeof c.modernized === "number" ? c.modernized : null;
        return '<tr><td>' + esc(c.name || c.key) + '</td>' +
          '<td class="num">' + (has(c.weight) ? esc(c.weight) : "-") + '</td>' +
          '<td class="num">' + (l === null ? '<span style="color:var(--text-muted)">n/a</span>' : l) + '</td>' +
          '<td class="num">' + (m === null ? '<span style="color:var(--text-muted)">n/a</span>' : m) + '</td>' +
          '<td class="num">' + (l !== null && m !== null ? deltaSpan(m - l) : "-") + '</td></tr>';
      }).join("") +
      '</tbody></table></div>'
    );
    out.push('</div></section>');
  }

  /* --------------------------------------------------- 4. coverage risks */
  var cov = arr(DATA.coverageRisks);
  if (cov.length) {
    out.push(
      '<section id="coverage"><h2>Resolved, or simply not migrated?</h2>' +
      '<p class="count-note" style="margin-bottom:14px">' +
      'A vulnerability that disappeared because the feature carrying it was never migrated is not a ' +
      'fix. It is an open migration item, and the flaw returns with the feature unless the new design ' +
      'addresses it. These are listed separately for that reason.' +
      '</p>'
    );
    cov.forEach(function (c) {
      out.push(
        '<div class="coverage">' +
          '<h4>' + esc(c.area || c.title || "Unmigrated area") + '</h4>' +
          (has(c.why) ? '<p class="why">' + esc(c.why) + '</p>' : "") +
          (arr(c.findings).length
            ? '<p style="margin:0;font-size:13px">Legacy findings that vanish with it: ' +
              arr(c.findings).map(function (id) {
                return '<a href="#' + esc(id) + '" class="tag">' + esc(id) + '</a>';
              }).join(" ") + '</p>'
            : "") +
          (has(c.recommendation)
            ? '<p class="why" style="margin:8px 0 0"><strong>Carry forward:</strong> ' + esc(c.recommendation) + '</p>'
            : "") +
        '</div>'
      );
    });
    out.push('</section>');
  }

  /* ------------------------------------------------------------- 5. items */
  function sideBlock(label, s, fallbackText) {
    if (!s) {
      return '<div class="side"><h5>' + esc(label) + '</h5>' +
             '<p class="none">' + esc(fallbackText) + '</p></div>';
    }
    var locs = arr(s.locations).map(function (l) {
      return '<div class="loc"><span class="path">' + esc(l.file) + '</span>' +
             (has(l.line) ? '<span style="color:var(--text-muted)">:' + esc(l.line) + '</span>' : "") +
             (has(l.excerpt) ? '<span class="code">' + esc(l.excerpt) + '</span>' : "") + '</div>';
    }).join("");
    return '<div class="side"><h5>' + esc(label) + '</h5>' +
      '<p style="margin:0 0 8px;font-size:13px">' +
        (has(s.id) ? '<span class="tag">' + esc(s.id) + '</span> ' : "") +
        (has(s.severity) ? sevIcon(s.severity) + " " + esc(s.severity) : "") +
        (has(s.confidence) ? ' <span class="conf">' + esc(s.confidence) + '</span>' : "") +
      '</p>' +
      (has(s.evidence)
        ? '<p style="margin:0 0 8px;font-size:13px;color:var(--text-secondary);line-height:1.55">' +
          esc(s.evidence) + '</p>'
        : "") +
      (locs || '<p class="none">No locations recorded.</p>') +
      '</div>';
  }

  function itemCard(i) {
    var tags = [];
    if (has(i.owasp)) tags.push('<span class="tag">' + esc(i.owasp) + '</span>');
    arr(i.cwe).forEach(function (c) { tags.push('<span class="tag">' + esc(c) + '</span>'); });
    arr(i.attack).forEach(function (a) {
      tags.push('<span class="tag">ATT&amp;CK ' + esc(a.id) + (has(a.name) ? " " + esc(a.name) : "") + '</span>');
    });
    if (i.nist) {
      arr(i.nist.ssdf).forEach(function (n) { tags.push('<span class="tag">SSDF ' + esc(n) + '</span>'); });
      arr(i.nist.sp80053).forEach(function (n) { tags.push('<span class="tag">800-53 ' + esc(n) + '</span>'); });
    }
    if (has(i.functionalArea)) tags.push('<span class="tag">' + esc(i.functionalArea) + '</span>');

    var s = [];
    s.push('<details class="finding" id="' + esc(i.id) + '" data-bucket="' + esc(i.bucket) +
           '" data-sev="' + esc(i.severity) + '">');
    s.push(
      '<summary>' +
        '<span class="chev"></span>' +
        '<span class="sev-pill" data-sev="' + esc(i.severity) + '">' + esc(i.severity) + '</span>' +
        bkPill(i.bucket) +
        '<span class="ftitle">' + esc(i.id) + ". " + esc(i.title) + '</span>' +
      '</summary>'
    );
    s.push('<div class="fbody">');
    if (tags.length) s.push('<div class="fblock"><div class="h">Standards</div>' + tags.join("") + '</div>');

    if (has(i.migrationNote)) {
      s.push('<div class="fblock"><div class="h">What the migration did</div>' +
             '<p style="margin:0">' + esc(i.migrationNote) + '</p></div>');
    }

    /* The side-by-side is the point of this report - always render both columns. */
    s.push('<div class="fblock"><div class="h">Evidence on each side</div><div class="side-by-side">' +
      sideBlock("Legacy", i.legacy,
        (i.bucket === "introduced" || i.bucket === "new-surface")
          ? "Not present in the legacy codebase." : "No legacy counterpart recorded.") +
      sideBlock("Modernized", i.modernized,
        i.bucket === "resolved"
          ? "No longer present in the modernized codebase." : "No modernized counterpart recorded.") +
      '</div>');
    if (i.match && (has(i.match.confidence) || has(i.match.basis))) {
      s.push('<p class="count-note" style="margin-top:10px">' +
        (has(i.match.confidence)
          ? '<span class="match" data-c="' + esc(i.match.confidence) + '">Match: ' + esc(i.match.confidence) + '</span> '
          : "") +
        esc(i.match.basis || "") + '</p>');
    }
    s.push('</div>');

    if (i.resolution && (has(i.resolution.reason) || has(i.resolution.detail))) {
      var warn = i.resolution.reason === "feature-not-migrated";
      s.push('<div class="fblock"><div class="h">Why it is gone</div>' +
        (warn
          ? '<div class="warnbox" style="margin-bottom:8px"><strong>Not a fix.</strong> ' +
            'The flaw disappeared with code that was never migrated. It returns with the feature.</div>'
          : "") +
        '<p style="margin:0">' +
        (has(i.resolution.reason) ? '<span class="tag">' + esc(i.resolution.reason) + '</span> ' : "") +
        esc(i.resolution.detail || "") + '</p></div>');
    }

    if (has(i.risk)) {
      s.push('<div class="fblock"><div class="h">Risk</div><p style="margin:0">' + esc(i.risk) + '</p></div>');
    }

    var r = i.remediation;
    if (r) {
      var badge = r.breakingChange
        ? '<span class="badge-br">Breaking change</span>'
        : (r.nonBreaking ? '<span class="badge-nb">Non-breaking</span>' : "");
      s.push('<div class="fblock"><div class="h">Remediation' + (badge ? " " + badge : "") +
        (has(r.effort) ? ' <span class="tag">Effort ' + esc(r.effort) + '</span>' : "") + '</div>');
      if (r.breakingChange) {
        s.push('<div class="warnbox" style="margin-bottom:10px"><strong>This fix changes behaviour.</strong> ' +
               'Schedule it deliberately &mdash; it is not a drop-in change.</div>');
      }
      if (has(r.summary)) s.push('<p style="margin:0 0 10px">' + esc(r.summary) + '</p>');
      if (arr(r.steps).length) {
        s.push('<ol class="steps">' + arr(r.steps).map(function (x) {
          return "<li>" + esc(x) + "</li>";
        }).join("") + '</ol>');
      }
      if (has(r.codeBefore) || has(r.codeAfter)) {
        s.push('<div class="diff" style="margin-top:12px">' +
          (has(r.codeBefore)
            ? '<div class="before"><div class="lbl">Before</div><pre class="code">' + esc(r.codeBefore) + '</pre></div>'
            : "") +
          (has(r.codeAfter)
            ? '<div class="after"><div class="lbl">After</div><pre class="code">' + esc(r.codeAfter) + '</pre></div>'
            : "") +
          '</div>');
      }
      s.push('</div>');
    }
    if (has(i.verification)) {
      s.push('<div class="fblock"><div class="h">Verification</div>' +
             '<div class="verify">' + esc(i.verification) + '</div></div>');
    }
    var refs = arr(i.references);
    if (refs.length) {
      s.push('<div class="fblock"><div class="h">References</div><ul class="plain">' +
        refs.map(function (x) {
          return has(x.url)
            ? '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.label || x.url) + '</a></li>'
            : "<li>" + esc(x.label) + "</li>";
        }).join("") + '</ul></div>');
    }
    s.push('</div></details>');
    return s.join("");
  }

  out.push('<section id="items"><h2>Finding-by-finding comparison</h2>');
  out.push(
    '<div class="toolbar no-print">' +
      '<span style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">Bucket</span>' +
      BUCKETS.map(function (b) {
        return '<button class="chip" type="button" data-bucket="' + b.key + '" aria-pressed="false">' +
               esc(b.label) + '</button>';
      }).join("") +
      '<span style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-left:10px">Severity</span>' +
      SEVS.map(function (s) {
        return '<button class="chip" type="button" data-sev="' + s + '" aria-pressed="false">' + s + '</button>';
      }).join("") +
      '<button class="btn" id="expandAll" type="button">Expand all</button>' +
    '</div>'
  );
  if (!items.length) {
    out.push('<div class="empty">No comparable findings were produced.</div>');
  }
  items.forEach(function (i) { out.push(itemCard(i)); });
  out.push('</section>');

  /* ----------------------------------------------------------- 6. roadmap */
  var roadmap = arr(DATA.roadmap);
  if (roadmap.length) {
    out.push('<section id="roadmap"><h2>Remediation roadmap for the modernized codebase</h2><div class="card">');
    roadmap.forEach(function (p) {
      out.push(
        '<div class="phase">' +
          '<div class="pnum">' + esc(p.phase) + '</div>' +
          '<div><h3 style="font-size:15px;margin:0 0 4px">' + esc(p.name) + '</h3>' +
            '<div style="font-size:12.5px;color:var(--text-muted)">' +
              arr(p.findings).map(function (id) {
                return '<a href="#' + esc(id) + '" class="tag">' + esc(id) + '</a>';
              }).join("") +
              (has(p.effort) ? ' <span class="tag">Effort ' + esc(p.effort) + '</span>' : "") +
            '</div>' +
            (has(p.rationale) ? '<p style="margin:8px 0 0;font-size:13.5px">' + esc(p.rationale) + '</p>' : "") +
          '</div>' +
          (has(p.scoreAfter) ? '<div class="pafter">&rarr; ' + esc(p.scoreAfter) + ' / 100</div>' : '<div></div>') +
        '</div>'
      );
    });
    out.push('</div></section>');
  }

  /* -------------------------------------------------------------- 7. cost */
  var cost = DATA.cost;
  if (cost) {
    out.push('<section id="cost"><h2>Cost of this analysis</h2><div class="card">');
    if (cost.source === "unavailable") {
      out.push('<p class="empty">Cost was not collected for this run.</p>');
    } else {
      if (cost.source === "estimate") {
        out.push('<div class="cost-caveat">These figures are an <strong>estimate</strong>. ' +
          'Transcript-based measurement was unavailable for this run.</div>');
      }
      var phases = arr(cost.phases);
      if (phases.length) {
        out.push('<div class="table-scroll"><table class="phase-cost"><thead><tr>' +
          '<th>Phase</th><th>Model</th><th class="num">Input</th><th class="num">Cache write</th>' +
          '<th class="num">Cache read</th><th class="num">Output</th><th class="num">Total tokens</th>' +
          '<th class="num">Cost</th></tr></thead><tbody>');
        phases.forEach(function (p) {
          var models = arr(p.byModel);
          if (!models.length) {
            out.push('<tr><td>' + esc(p.name) + '</td><td colspan="6" style="color:var(--text-muted)">' +
              esc(p.note || "not collected") + '</td><td class="num">-</td></tr>');
            return;
          }
          models.forEach(function (m, idx) {
            var t = m.tokens || {}, c = m.costUSD || {};
            out.push('<tr>' +
              (idx === 0 ? '<td>' + esc(p.name) + '</td>' : '<td></td>') +
              '<td><code>' + esc(m.model) + '</code>' +
                (m.priced === false ? ' <span class="tag">unpriced</span>' : "") + '</td>' +
              '<td class="num">' + num(t.input) + '</td>' +
              '<td class="num">' + num((t.cacheWrite5m || 0) + (t.cacheWrite1h || 0)) + '</td>' +
              '<td class="num">' + num(t.cacheRead) + '</td>' +
              '<td class="num">' + num(t.output) + '</td>' +
              '<td class="num">' + num(t.total) + '</td>' +
              '<td class="num">' + money(c.total) + '</td>' +
            '</tr>');
          });
          if (has(p.subtotalTokens) || has(p.subtotalCostUSD)) {
            out.push('<tr><td></td><td style="color:var(--text-muted)">subtotal</td>' +
              '<td class="num" colspan="4"></td>' +
              '<td class="num">' + num(p.subtotalTokens) + '</td>' +
              '<td class="num">' + money(p.subtotalCostUSD) + '</td></tr>');
          }
        });
        var tot = cost.totals || {};
        out.push('<tr class="total"><td>Total</td><td></td><td class="num" colspan="4"></td>' +
          '<td class="num">' + num(tot.totalTokens) + '</td>' +
          '<td class="num">' + money(tot.totalCostUSD) + '</td></tr>');
        out.push('</tbody></table></div>');
      }
      var tt = cost.totals || {};
      out.push('<div class="cost-total">' +
        '<div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)">Total tokens</div>' +
        '<div class="big">' + num(tt.totalTokens) + '</div></div>' +
        '<div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)">Total cost</div>' +
        '<div class="big">' + money(tt.totalCostUSD) + '</div></div>' +
      '</div>');
      if (has(cost.note)) out.push('<p class="count-note" style="margin-top:12px">' + esc(cost.note) + '</p>');
    }
    out.push('</div></section>');
  }

  /* ------------------------------------------------- 8. method + limits */
  if (arr(DATA.methodology).length) {
    out.push('<section id="method"><h2>How the comparison was made</h2><div class="card">' +
      arr(DATA.methodology).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
      '</div></section>');
  }
  var lim = arr(DATA.limitations);
  if (lim.length) {
    out.push('<section id="limits"><h2>Limitations</h2><div class="card"><ul class="plain">' +
      lim.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") +
      '</ul></div></section>');
  }

  out.push(
    '<footer class="foot">' +
      esc(meta.analyst || "Claude Code - security-audit-compare skill") +
      ' &middot; generated ' + esc(meta.scanDate || "") +
      ' &middot; static analysis of two source trees; no application was built or executed.' +
    '</footer>'
  );
  out.push('</div>');

  document.getElementById("root").innerHTML = out.join("");

  /* ------------------------------------------------------------ behaviour */
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* file:// - fine */ } }
  };

  var saved = store.get("cmp-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  var btn = document.getElementById("themeBtn");
  if (btn) btn.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    store.set("cmp-theme", next);
  });

  var cards = [].slice.call(document.querySelectorAll("details.finding"));
  var chips = [].slice.call(document.querySelectorAll(".chip"));

  function applyFilter() {
    var onB = chips.filter(function (c) {
      return c.hasAttribute("data-bucket") && c.getAttribute("aria-pressed") === "true";
    }).map(function (c) { return c.getAttribute("data-bucket"); });
    var onS = chips.filter(function (c) {
      return c.hasAttribute("data-sev") && c.getAttribute("aria-pressed") === "true";
    }).map(function (c) { return c.getAttribute("data-sev"); });
    cards.forEach(function (card) {
      var okB = !onB.length || onB.indexOf(card.getAttribute("data-bucket")) >= 0;
      var okS = !onS.length || onS.indexOf(card.getAttribute("data-sev")) >= 0;
      card.hidden = !(okB && okS);
    });
  }
  chips.forEach(function (c) {
    c.addEventListener("click", function () {
      c.setAttribute("aria-pressed", c.getAttribute("aria-pressed") === "true" ? "false" : "true");
      applyFilter();
    });
  });

  var exp = document.getElementById("expandAll");
  if (exp) exp.addEventListener("click", function () {
    var anyClosed = cards.some(function (c) { return !c.open && !c.hidden; });
    cards.forEach(function (c) { if (!c.hidden) c.open = anyClosed; });
    exp.textContent = anyClosed ? "Collapse all" : "Expand all";
  });

  function openHash() {
    if (!location.hash) return;
    var t = document.getElementById(location.hash.slice(1));
    if (t && t.tagName === "DETAILS") { t.hidden = false; t.open = true; t.scrollIntoView({ block: "start" }); }
  }
  window.addEventListener("hashchange", openHash);
  openHash();
})();
</script>
</body>
</html>
